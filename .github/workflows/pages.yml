# 把前端（纯静态文件）发布到 GitHub Pages。后端 API 在自己的服务器上。
# 首次使用：仓库 Settings → Pages → Source 选 “GitHub Actions”。
# 可选：Settings → Secrets and variables → Actions → Variables 里设置 FP_API_BASE 覆盖默认 API 地址。
#
# 2026-09-23 起 GitHub Actions 不再提供 Node 20。checkout、configure-pages、
# upload-pages-artifact（内部的 upload-artifact）和 deploy-pages 必须用 Node 24
# 的主版本，否则工作流会在启动 action 时失败，站点不会发布。
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 不要取消正在进行的 Pages 部署，否则发布可能中断。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FP_API_BASE: ${{ vars.FP_API_BASE || 'https://firstp.cheeshare.club' }}
    steps:
      - uses: actions/checkout@v5
      - name: Build static site
        run: |
          mkdir -p _site/static
          cp app/static/index.html _site/index.html
          cp app/static/app.js app/static/style.css _site/static/
          printf 'window.FP_API_BASE = %s;\n' "\"$FP_API_BASE\"" > _site/static/config.js
          touch _site/.nojekyll
          ls -R _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v5 默认排除点开头的文件，.nojekyll 需要显式保留。
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
